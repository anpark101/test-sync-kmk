# Prepared PRIVATE-repository build file. Upload unchanged into .github/workflows/.
# Uses your account's included Actions allowance, not unlimited public-repo minutes.
# Single worker and one-day artifacts reduce memory/storage use. No personal reading data is uploaded.
# No passwords, personal backups, API tokens or billing information are needed.
# This is experimental source code, NOT an installable APK or a live sync website.
# Both phones must install the SAME successfully built APK.
name: Build Komikku Quick Sync (Private)

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komikku-quick-sync-private-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the experimental APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the pinned upstream version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: komikku-app/komikku
          ref: e30ff83265d7affcc14e172ea9eadf469db1f4aa
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install the required Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

