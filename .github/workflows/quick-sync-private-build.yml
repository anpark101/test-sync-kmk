# Builds the experimental "Komikku Sync Lab" APK in the cloud.
# Uses your account's included Actions allowance, not unlimited public-repo minutes.
# Single worker and short-lived artifacts reduce memory/storage use.
# No personal reading data is uploaded.
# No passwords, personal backups, API tokens or billing information are needed.
# This is experimental source code, NOT an installable APK or a live sync website.
# Both phones must install the SAME successfully built APK.
name: Build Komikku Quick Sync (Private)

'on':
  workflow_dispatch:
  push:
    branches:
      - arena/01a0feed-komikku-test-sync
      - arena/01a10527-komikku-test-sync
    paths:
      - 'quick-sync-kit/**'
      - '.github/workflows/quick-sync-private-build.yml'

permissions:
  contents: write

concurrency:
  group: komikku-quick-sync-private-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the experimental APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out this repository (the Quick Sync kit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check out the pinned upstream Komikku version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: komikku-app/komikku
          ref: e30ff83265d7affcc14e172ea9eadf469db1f4aa
          path: upstream
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      # v4.0.4: the old pinned action tried to install the removed "tools"
      # SDK package and failed. This one installs cmdline-tools 15859902.
      - name: Set up Android tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install the required Android SDK
        shell: bash
        run: |
          set -o pipefail
          {
            sdkmanager --version
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
            sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;35.0.0'
          } 2>&1 | tee step-sdk.log || {
            echo -n "::error title=Android SDK setup failed::"
            tail -c 6000 step-sdk.log | python3 -c 'import sys; d=sys.stdin.buffer.read(); sys.stdout.write(d.decode("utf-8","replace").replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            echo
            exit 1
          }

      - name: Verify the Quick Sync kit files are intact
        shell: bash
        run: |
          set -o pipefail
          (cd quick-sync-kit && sha256sum -c SHA256SUMS) 2>&1 | tee step-kit.log || {
            echo -n "::error title=Quick Sync kit corrupted::"
            tail -c 3000 step-kit.log | python3 -c 'import sys; d=sys.stdin.buffer.read(); sys.stdout.write(d.decode("utf-8","replace").replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            echo
            exit 1
          }

      - name: Apply the prepared Quick Sync changes
        shell: bash
        run: |
          set -o pipefail
          python3 quick-sync-kit/apply_patch.py upstream 2>&1 | tee step-patch.log || {
            echo -n "::error title=Patch application failed (upstream mismatch)::"
            tail -c 6000 step-patch.log | python3 -c 'import sys; d=sys.stdin.buffer.read(); sys.stdout.write(d.decode("utf-8","replace").replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            echo
            exit 1
          }

      - name: Test the reading-progress edit clocks
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          {
            ./gradlew --no-daemon --max-workers=1 \
              -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process \
              :domain:testReleaseUnitTest --tests 'tachiyomi.domain.sync.ProgressStampTest'
          } 2>&1 | tee ../step-domain-tests.log || {
            echo -n "::error title=ProgressStamp tests failed::"
            tail -c 6000 ../step-domain-tests.log | python3 -c 'import sys; d=sys.stdin.buffer.read(); sys.stdout.write(d.decode("utf-8","replace").replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            echo
            exit 1
          }

      - name: Build the separate test app
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          {
            ./gradlew --no-daemon --max-workers=1 \
              -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process \
              -Pdisable-code-shrink :app:assemblePreview
          } 2>&1 | tee ../step-assemble.log || {
            echo -n "::error title=App compilation failed::"
            tail -c 8000 ../step-assemble.log | python3 -c 'import sys; d=sys.stdin.buffer.read(); sys.stdout.write(d.decode("utf-8","replace").replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            echo
            exit 1
          }

      - name: Test page and library conflict merging
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          {
            ./gradlew --no-daemon --max-workers=1 \
              -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process \
              :app:testPreviewUnitTest --tests 'eu.kanade.tachiyomi.data.sync.QuickSyncMergeTest'
          } 2>&1 | tee ../step-merge-tests.log || {
            echo -n "::error title=QuickSyncMergeTest failed::"
            tail -c 8000 ../step-merge-tests.log | python3 -c 'import sys; d=sys.stdin.buffer.read(); sys.stdout.write(d.decode("utf-8","replace").replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            echo
            exit 1
          }

      - name: Verify and package the installable APK
        shell: bash
        run: |
          set -euo pipefail
          source='upstream/app/build/outputs/apk/preview/app-universal-preview.apk'
          test -f "$source"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$source"
          info=$("$tools/aapt" dump badging "$source")
          echo "$info" | grep "package: name='app.komikku.sync.beta'"
          mkdir -p apk-deliverable
          cp "$source" apk-deliverable/Komikku-Quick-Sync-0.2-test.apk
          (cd apk-deliverable && sha256sum Komikku-Quick-Sync-0.2-test.apk > SHA256.txt)
          printf '%s\n' 'Unofficial experimental build. Keep original Komikku and its backups.' 'Install this same APK on BOTH devices. Use a separate WebDAV test folder.' 'This APK is locally debug-signed for a one-off trial; later builds may have a different signing key.' > apk-deliverable/READ-FIRST.txt

      - name: Download this APK from the Artifacts section
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Komikku-Quick-Sync-APK
          path: apk-deliverable/
          retention-days: 1
          if-no-files-found: error

      # Publishes from the runner (not your computer) so the APK stays
      # downloadable from the Releases page until you delete it.
      - name: Publish the APK to the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='quick-sync-v0.2'
          assets=(apk-deliverable/Komikku-Quick-Sync-0.2-test.apk apk-deliverable/SHA256.txt apk-deliverable/READ-FIRST.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Komikku Quick Sync 0.2 (test build)' \
              --notes 'Unofficial experimental build of Komikku v1.14.1 with Quick Sync 0.2: automatic library and page-level reading-progress sync between two devices through your own WebDAV/SyncYomi folder, now without waiting on sync. Chapters and the Start/Resume buttons open instantly; the newest cloud page is applied in the background, and a sync that just finished is reused instead of starting a second one. Install the SAME apk on BOTH phones. Keep your original Komikku and its backups. Use a dedicated test folder for sync data. Debug-signed trial build.' \
              "${assets[@]}"
          fi

      - name: Save test reports if the build fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Quick-Sync-test-reports
          path: |
            upstream/domain/build/reports/tests/
            upstream/domain/build/test-results/
            upstream/app/build/reports/tests/
            upstream/app/build/test-results/
          retention-days: 1
          if-no-files-found: ignore
